{% extends 'core/base.html' %}

{% block title %}Редактировать компанию{% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
    <a href="{% url 'company_members' %}" class="text-secondary" style="text-decoration: none;">← Назад</a>
</div>

<div class="form-container">
    <div class="card">
        <h1>Редактировать компанию</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Название компании</label>
                <input type="text" name="name" class="form-input" value="{{ company.name }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Описание</label>
                <textarea name="description" class="form-textarea" rows="4">{{ company.description }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Сохранить</button>
        </form>
    </div>
</div>
{% endblock %}
