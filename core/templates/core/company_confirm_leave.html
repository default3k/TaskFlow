{% extends 'core/base.html' %}

{% block title %}Выход из компании{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h1 style="margin-bottom: 20px;">Выход из компании</h1>
    
    <p style="margin-bottom: 20px;">
        Вы уверены, что хотите выйти из компании <strong>"{{ company.name }}"</strong>?
    </p>
    
    <div style="background: #fef3c7; border: 1px solid #fde68a; border-radius: 8px; padding: 15px; margin-bottom: 20px;">
        <p style="color: #92400e; margin: 0;">
            После выхода вы потеряете доступ ко всем задачам и проектам компании.
        </p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 10px;">
            <a href="{% url 'company_members' %}" class="btn btn-outline" style="flex: 1; text-align: center;">
                Отмена
            </a>
            <button type="submit" class="btn btn-danger" style="flex: 1;">
                👋 Выйти из компании
            </button>
        </div>
    </form>
</div>
{% endblock %}
