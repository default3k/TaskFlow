{% extends 'core/base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <h1 style="margin-bottom: 20px;">Регистрация</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Имя пользователя</label>
                <input type="text" name="username" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Телефон</label>
                <input type="text" name="phone" class="form-input">
            </div>
            
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" name="password1" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Подтверждение пароля</label>
                <input type="password" name="password2" class="form-input" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Зарегистрироваться</button>
        </form>
        <div class="text-center mt-2">
            <a href="{% url 'login' %}" style="color: #3b82f6;">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</div>
{% endblock %}
